<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>meat & love</title>
<style>
body{margin:0;font-family:Helvetica,Arial;background:#E8D6B7;color:#1E3A2F;padding-bottom:220px}
header{text-align:center;padding:24px;background:#F5EBDA}
header img{width:190px;height:190px;border-radius:50%;display:block;margin:0 auto 12px;object-fit:cover;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:1000px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:10px;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:280px;object-fit:cover;border-radius:12px;background:#eee;display:block}
.card h3{font-size:13px;margin:8px 0 2px;min-height:32px}
.badge{position:absolute;top:14px;left:14px;background:#C0392B;color:#fff;font-size:11px;padding:4px 8px;border-radius:20px;font-weight:800;z-index:2}
.btn{width:100%;background:#1E3A2F;color:#fff;border:0;padding:10px;border-radius:10px;font-weight:800;margin-top:6px;cursor:pointer}
.cart{position:fixed;bottom:12px;left:12px;right:12px;background:#1E3A2F;color:#fff;padding:14px;border-radius:16px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.cart-actions{display:flex;gap:8px}
.btn-stripe{flex:1;background:#635BFF;color:#fff;border:0;padding:14px;border-radius:10px;font-weight:900;cursor:pointer}
.btn-wa{flex:1;background:#fff;color:#1E3A2F;border:0;padding:14px;border-radius:10px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<header>
<img src="img/logo.png" onerror="this.onerror=null;this.src='logo.png'">
<h2 style="margin:0">meat & love ♡</h2>
<p style="margin:4px 0 0;font-size:12px;letter-spacing:2px">BUENA TIERRA • BUENA CARNE • BUENA ONDA</p>
</header>

<div class="grid" id="grid"></div>

<div class="cart">
<b id="total">Carrito vacío</b>
<small id="detalle">Envío CDMX $99 • Pago seguro con Stripe</small>
<div class="cart-actions">
<button class="btn-stripe" onclick="pagarStripe()">Pagar con Stripe</button>
<button class="btn-wa" onclick="wa()">WhatsApp</button>
</div>
</div>

<script>
const STRIPE="https://buy.stripe.com/4gMcN63Paciw2Hm7fX0VO01";
const ENVIO=99;

// TODOS EN MINUSCULAS PARA QUE GITHUB NO FALLE
const prods=[
["SIRLOIN 500g",333,"sirloin.jpg"],
["MILANESA 500g",325,"milanesa.jpg"],
["MOLIDA DIEZMILLO 500g",320,"molidadiezmillo.jpg"],
["MOLIDA PESCUEZO 500g",240,"molida.jpg"],
["ARRACHERA 500g",320,"arrachera.jpg"],
["PAVO THANKSGIVING APARTADO 1kg",320,"pavotg.jpg",true],
["COSTILLA 500g",438,"costilla.jpg"],
["CHORIZO 500g",229,"chorizo.jpg"],
["BISTEC 500g",320,"bistec.jpg"],
["LOMO 500g",250,"lomo.jpg"],
["PICAÑA 500g",307,"picana.jpg"],
["FILETE 500g",385,"filete.jpg"],
["CECINA 500g",333,"cecina.jpg"],
["HUEVO 30pzas",156,"huevo.jpg"],
["RETAZO 500g",206,"retazo.jpg"]
];

let cart=[];
const grid=document.getElementById('grid');

prods.forEach((p,i)=>{
  let badge=p[3]?`<span class="badge">LIMITADO 20</span>`:"";
  grid.innerHTML+=`<div class="card">${badge}<img src="img/${p[2]}" onerror="this.onerror=null;this.src='${p[2]}'" alt="${p[0]}"><h3>${p[0]}</h3><b>$${p[1]}</b><br><button class="btn" onclick="add(${i})">Agregar</button></div>`;
});

function add(i){
  cart.push(prods[i]);
  let sub=cart.reduce((s,p)=>s+p[1],0);
  let tot=sub+ENVIO;
  document.getElementById('total').innerText=`Total con envío: $${tot} (${cart.length} productos)`;
  document.getElementById('detalle').innerText=`Subtotal $${sub} + Envío $${ENVIO} = $${tot}`;
}

function wa(){
  if(!cart.length) return alert('Agrega algo al carrito');
  let sub=cart.reduce((s,p)=>s+p[1],0);
  let tot=sub+ENVIO;
  let lista=cart.map(p=>`- ${p[0]} $${p[1]}`).join('%0A');
  let msg=`Hola meat&love!%0AQuiero pedir:%0A${lista}%0A%0ASubtotal: $${sub}%0AEnvio: $${ENVIO}%0ATotal: $${tot}`;
  window.open('https://wa.me/525611281892?text='+msg,'_blank');
}

function pagarStripe(){
  if(!cart.length) return alert('Agrega algo al carrito');
  wa();
  setTimeout(()=>window.open(STRIPE,'_blank'),700);
}
</script>
</body>
</html>
