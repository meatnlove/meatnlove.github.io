<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>meat & love</title>
<style>body{margin:0;font-family:Helvetica;background:#E8D6B7;color:#1E3A2F;padding-bottom:220px}header{text-align:center;padding:24px;background:#F5EBDA}header img{width:190px;height:190px;border-radius:50%;display:block;margin:0 auto 12px;object-fit:cover}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:1000px;margin:0 auto}.card{background:#fff;border-radius:16px;padding:10px}.card img{width:100%;height:260px;object-fit:cover;border-radius:12px;background:#eee;display:block}.btn{width:100%;background:#1E3A2F;color:#fff;border:0;padding:10px;border-radius:10px;font-weight:800;margin-top:6px}.cart{position:fixed;bottom:12px;left:12px;right:12px;background:#1E3A2F;color:#fff;padding:14px;border-radius:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}.cart-actions{display:flex;gap:8px}.btn-stripe{flex:1;background:#635BFF;color:#fff;border:0;padding:14px;border-radius:10px;font-weight:900}.btn-wa{flex:1;background:#fff;color:#1E3A2F;border:0;padding:14px;border-radius:10px;font-weight:900}</style></head><body>
<header><img src="img/logo.png"><h2>meat & love ♡</h2></header>
<div class="grid" id="grid"></div>
<div class="cart"><b id="total">Carrito vacío</b><small id="det">Envío CDMX $99</small><div class="cart-actions"><button class="btn-stripe" onclick="pagar()">Pagar con Stripe</button><button class="btn-wa" onclick="wa()">WhatsApp</button></div></div>
<script>
const STRIPE="https://buy.stripe.com/4gMcN63Paciw2Hm7fX0VO01"; const ENVIO=99;
const prods=[["SIRLOIN 500g",333,"sirloin.jpg"],["TOCINO 500g",285,"tocino.jpg"],["ARRACHERA 500g",320,"arrachera.jpg"],["BISTEC 500g",320,"bistec.jpg"],["CECINA 500g",333,"cecina.jpg"],["CHORIZO 500g",229,"chorizo.jpg"],["COSTILLAS 500g",438,"costillas.jpg"],["FILETE 500g",385,"filete.jpg"],["HUEVO 30pzas",156,"huevo.jpg"],["LOMO 500g",250,"lomo.jpg"],["MILANESA 500g",325,"milanesa.jpg"],["MOLIDA 500g",240,"molida.jpg"],["MOLIDA DIEZMILLO 500g",320,"molidadiezmillo.jpg"],["PAVO TG 1kg",320,"pavoTG.jpg"],["PICAÑA 500g",307,"picana.jpg"],["RETAZO 500g",206,"retazo.jpg"]];
let cart=[]; const grid=document.getElementById('grid');
prods.forEach((p,i)=>{let img=p[2]==='pavoTG.jpg'?`<img src="img/${p[2]}" onerror="this.src='img/pavotg.jpg'">`:p[2]==='costillas.jpg'?`<img src="img/${p[2]}" onerror="this.src='img/costilla.jpg'">`:`<img src="img/${p[2]}">`;grid.innerHTML+=`<div class="card">${img}<h3>${p[0]}</h3><b>$${p[1]}</b><br><button class="btn" onclick="add(${i})">Agregar</button></div>`;});
function add(i){cart.push(prods[i]);let s=cart.reduce((a,b)=>a+b[1],0);document.getElementById('total').innerText=`Total: $${s+ENVIO} (${cart.length} productos)`;document.getElementById('det').innerText=`Subtotal $${s} + Envío $${ENVIO}`}
function getMsg(){let s=cart.reduce((a,b)=>a+b[1],0);let l=cart.map(p=>`- ${p[0]} $${p[1]}`).join('%0A');return {s,l,msg:`Hola quiero:%0A${l}%0ASubtotal $${s}%0AEnvío $${ENVIO}%0ATOTAL $${s+ENVIO}`}}
function wa(){if(!cart.length)return alert('Agrega algo');let {msg}=getMsg();window.open('https://wa.me/525611281892?text='+msg,'_blank')}
function pagar(){if(!cart.length)return alert('Agrega algo');let {s,l}=getMsg();let msg=`PEDIDO STRIPE:%0A${l}%0ATOTAL $${s+ENVIO}%0A%0AInstruccion para cliente: En Stripe ajusta cantidades, deja en 0 lo que no quieres.`;window.open('https://wa.me/525611281892?text='+msg,'_blank');setTimeout(()=>{window.open(STRIPE,'_blank')},700)}
</script></body></html>
