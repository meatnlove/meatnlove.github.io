<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>meat & love</title><style>body{margin:0;font-family:Helvetica;background:#E8D6B7;color:#1E3A2F;padding-bottom:180px}header{text-align:center;padding:24px;background:#F5EBDA}header img{width:190px;height:190px;border-radius:50%;display:block;margin:0 auto 12px;object-fit:cover}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:1000px;margin:0 auto}.card{background:#fff;border-radius:16px;padding:10px}.card img{width:100%;height:280px;object-fit:cover;border-radius:12px}.btn{width:100%;background:#1E3A2F;color:#fff;border:0;padding:10px;border-radius:10px;font-weight:800}.cart{position:fixed;bottom:20px;left:12px;right:12px;background:#1E3A2F;color:#fff;padding:14px;border-radius:16px;z-index:9999;display:flex;flex-direction:column;gap:10px}.cart-actions{display:flex;gap:8px}.btn-mp{flex:1;background:#009EE3;color:#fff;border:0;padding:14px;border-radius:10px;font-weight:900}.btn-wa{flex:1;background:#fff;color:#1E3A2F;border:0;padding:14px;border-radius:10px;font-weight:900}</style></head><body><header><img src="img/logo.png" alt="meat & love"><h2>meat & love ♡</h2><p>BUENA TIERRA • BUENA CARNE • BUENA ONDA</p></header><div class="grid" id="grid"></div><div class="cart"><b id="total">Carrito vacío</b><div class="cart-actions"><button class="btn-mp" onclick="pagar()">Pagar con Mercado Pago</button><button class="btn-wa" onclick="wa()">WhatsApp</button></div></div><script>const MP="https://link.mercadopago.com.mx/meatnlove";const prods=[["CECINA",333],["CHORIZO",229],["COSTILLAS",438],["LOMO",250],["MOLIDA",240],["TOCINO",271],["RETAZO",206],["FILETE",385],["PICANA",307],["HUEVO",156],["ARRACHERA",450],["BISTEC",320]];let cart=[];const grid=document.getElementById('grid');const bases=["cecina","chorizo","costillas","lomo","molida","tocino","retazo","filete","picana","huevo","arrachera","bistec"];bases.forEach((b,i)=>{grid.innerHTML+=`<div class=card><img src="img/${b}.jpeg" onerror="this.src='img/${b}.jpg'"><h3>${prods[i][0]}</h3><b>$${prods[i][1]}</b><br><button class=btn onclick="add(${i})">Agregar</button></div>`});function add(i){cart.push(prods[i]);let t=cart.reduce((s,p)=>s+p[1],0);document.getElementById('total').innerText=`Total: $${t} (${cart.length})`;}function wa(){if(!cart.length)return alert('Agrega algo');let t=cart.reduce((s,p)=>s+p[1],0);let l=cart.map(p=>`- ${p[0]} $${p[1]}`).join('%0A');window.open('https://wa.me/525611281892?text=Pedido:%0A'+l+'%0ATotal $'+t,'_blank');}function pagar(){if(!cart.length)return alert('Agrega algo');wa();setTimeout(()=>window.open(MP,'_blank'),600);}</script></body></html>
