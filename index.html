<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>meat & love</title>
<style>
body{margin:0;font-family:Helvetica,Arial,sans-serif;background:#E8D6B7;color:#1E3A2F;padding-bottom:280px}
header{text-align:center;padding:24px;background:#F5EBDA}
header img{width:190px;height:190px;border-radius:50%;display:block;margin:0 auto 12px;object-fit:cover;background:#fff;border:3px solid #fff}
h1{margin:0;font-size:26px}
.section-title{max-width:1000px;margin:28px auto 0;padding:0 12px;font-size:18px;font-weight:900;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:1000px;margin:0 auto}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;height:160px;object-fit:cover;border-radius:12px;background:#eee;display:block}
.card h3{font-size:11px;margin:8px 0 2px;text-transform:uppercase;line-height:1.2;min-height:28px}
.card b{font-size:14px}
.btn{width:100%;background:#1E3A2F;color:#fff;border:0;padding:10px;border-radius:10px;font-weight:800;margin-top:6px;cursor:pointer}
.cart{position:fixed;bottom:12px;left:12px;right:12px;background:#1E3A2F;color:#fff;padding:14px;border-radius:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow:auto}
.cart-item{display:flex;justify-content:space-between;align-items:center;background:#2a4d3f;padding:6px 10px;border-radius:8px;margin-top:6px;font-size:13px}
.cart-item button{background:#fff;color:#1E3A2F;border:0;border-radius:6px;padding:2px 8px;font-weight:900;margin-left:4px;cursor:pointer}
.cart-actions{display:flex;gap:8px;margin-top:8px}
.btn-mp{flex:1;background:#009ee3;color:#fff;border:0;padding:14px;border-radius:10px;font-weight:900;cursor:pointer}
.btn-wa{flex:1;background:#fff;color:#1E3A2F;border:0;padding:14px;border-radius:10px;font-weight:900;cursor:pointer}
.ship-opt{display:flex;gap:8px;margin-top:10px}
.ship-opt label{flex:1;background:#2a4d3f;padding:10px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;border:2px solid transparent}
.ship-opt label.active{border-color:#fff;background:#fff;color:#1E3A2F}
.ship-opt input{display:none}
</style>
</head>
<body>
<header>
<img src="img/logo.png" onerror="this.onerror=null;this.src='img/img/logo.png'" alt="logo">
<h1>meat & love ♡</h1><p style="margin:4px 0 0">CDMX - Orgánico y agroecológico</p>
</header>
<div class="section-title">🐔 Pollo y Huevo</div><div class="grid" id="grid-pollo"></div>
<div class="section-title">🦃 Pavo</div><div class="grid" id="grid-pavo"></div>
<div class="section-title">🐄 Res y Cerdo</div><div class="grid" id="grid-res"></div>
<div class="section-title">🐾 Mascotas</div><div class="grid" id="grid-mascotas"></div>
<div class="cart">
<b id="total">Carrito vacío</b>
<small id="det">Elige entrega</small>
<div class="ship-opt">
<label id="lab-envio" class="active"><input type="radio" name="e" checked onchange="setE('envio')"> 🚚 Envío $99</label>
<label id="lab-pickup"><input type="radio" name="e" onchange="setE('pickup')"> 📍 Recoger GRATIS<br><small style="font-size:10px">Morvan 196 B Virreyes<br>Lun 2pm-8pm</small></label>
</div>
<div id="lista"></div>
<div class="cart-actions"><button id="btn-pagar" class="btn-mp" onclick="pagar()">Pagar con tarjeta 💳</button><button class="btn-wa" onclick="wa()">WhatsApp</button></div>
</div>
<script src="productos.js"></script>
<script>
const ENVIO=99; const WA_NUMBER="525611281892";
const VERCEL_CHECKOUT = "/api/checkout";
let entrega='envio'; let cart=[]; try{let s=localStorage.getItem('meatnlove-cart'); if(s) cart=JSON.parse(s);}catch(e){}
function saveCart(){localStorage.setItem('meatnlove-cart', JSON.stringify(cart));}
function setE(t){ entrega=t; document.getElementById('lab-envio').classList.toggle('active',t==='envio'); document.getElementById('lab-pickup').classList.toggle('active',t==='pickup'); render(); }
const gp=document.getElementById('grid-pollo'), gv=document.getElementById('grid-pavo'), gr=document.getElementById('grid-res'), gm=document.getElementById('grid-mascotas');
function imgTag(f){return `<img src="img/${f}" loading="lazy" onerror="this.onerror=null;this.src='img/img/${encodeURI(f)}'">`;}
polloProds.forEach((p)=>{gp.innerHTML+=`<div class="card">${imgTag(p[2])}<h3>${p[0]}</h3><b>$${p[1]}</b><button class="btn" onclick="addP('${p[0]}',${p[1]})">Agregar</button></div>`});
pavoProds.forEach((p)=>{gv.innerHTML+=`<div class="card">${imgTag(p[2])}<h3>${p[0]}</h3><b>$${p[1]}</b><button class="btn" onclick="addP('${p[0]}',${p[1]})">Agregar</button></div>`});
resProds.forEach((p)=>{gr.innerHTML+=`<div class="card">${imgTag(p[2])}<h3>${p[0]}</h3><b>$${p[1]}</b><button class="btn" onclick="addP('${p[0]}',${p[1]})">Agregar</button></div>`});
mascotaProds.forEach((p)=>{gm.innerHTML+=`<div class="card">${imgTag(p[2])}<h3>${p[0]}</h3><b>$${p[1]}</b><button class="btn" onclick="addP('${p[0]}',${p[1]})">Agregar</button></div>`});
function addP(name,price){let f=cart.find(c=>c.name===name); if(f) f.qty++; else cart.push({name,price,qty:1}); render();}
function render(){saveCart(); let lista=document.getElementById('lista'); lista.innerHTML=''; if(!cart.length){document.getElementById('total').innerText='Carrito vacío'; document.getElementById('det').innerText='Elige envío o recoger gratis'; document.getElementById('btn-pagar').innerText='Pagar con tarjeta 💳'; return;} let s=cart.reduce((a,b)=>a+b.price*b.qty,0); let c=cart.reduce((a,b)=>a+b.qty,0); let envioActual = entrega==='pickup'?0:ENVIO; let total=s+envioActual; document.getElementById('total').innerText=`Total: $${total} (${c} prod)`; document.getElementById('det').innerText = entrega==='pickup'? `Subtotal $${s} + Recoger GRATIS en Morvan 196 B` : `Subtotal $${s} + Envío $${ENVIO}`; cart.forEach((it,idx)=>{lista.innerHTML+=`<div class="cart-item"><span>${it.name} x${it.qty}</span><span><button onclick="cambia(${idx},-1)">-</button><button onclick="cambia(${idx},1)">+</button><button onclick="quita(${idx})">X</button></span></div>`}); document.getElementById('btn-pagar').innerText = entrega==='pickup' ? 'Pagar Recoger Morvan 💳' : 'Pagar con Envío 💳';}
function cambia(i,d){cart[i].qty+=d; if(cart[i].qty<=0) cart.splice(i,1); render();}
function quita(i){cart.splice(i,1); render();}
function wa(){if(!cart.length) return alert('Agrega algo'); let s=cart.reduce((a,b)=>a+b.price*b.qty,0); let envioActual=entrega==='pickup'?0:ENVIO; let total=s+envioActual; let l=cart.map(p=>`- ${p.name} x${p.qty} $${p.price*p.qty}`).join('%0A'); let tipo=entrega==='pickup'? 'RECOGER GRATIS en Morvan 196 B, Lomas Virreyes (Lunes 2pm-8pm)' : `Envío CDMX $${ENVIO}`; let msg=`Hola Meat&Love! Quiero pedir:%0A${l}%0A%0ASubtotal: $${s}%0A${tipo}%0ATOTAL: $${total}`; window.open(`https://wa.me/${WA_NUMBER}?text=${msg}`,'_blank');}
async function pagar(){
  if(!cart.length) return alert('Agrega algo');
  let btn=document.getElementById('btn-pagar');
  btn.innerText='Conectando...'; btn.disabled=true;
  try{
    let res=await fetch(VERCEL_CHECKOUT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cart, pickup: entrega==='pickup'})
    });
    let data=await res.json();
    if(data.url){ window.location.href=data.url; return; }
    throw new Error(data.error || 'Sin URL');
  }catch(e){
    alert('Error Vercel: '+e.message);
    btn.innerText='Pagar con tarjeta 💳'; btn.disabled=false;
  }
}
render();
</script>
</body>
</html>
