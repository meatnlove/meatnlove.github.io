<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>meat & love</title>
<style>body{margin:0;font-family:Helvetica;background:#E8D6B7;color:#1E3A2F;padding-bottom:240px}header{text-align:center;padding:24px;background:#F5EBDA}header img{width:190px;height:190px;border-radius:50%;display:block;margin:0 auto 12px;object-fit:cover}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:1000px;margin:0 auto}.card{background:#fff;border-radius:16px;padding:10px}.card img{width:100%;height:260px;object-fit:cover;border-radius:12px;background:#eee;display:block}.btn{width:100%;background:#1E3A2F;color:#fff;border:0;padding:10px;border-radius:10px;font-weight:800;margin-top:6px}.cart{position:fixed;bottom:12px;left:12px;right:12px;background:#1E3A2F;color:#fff;padding:14px;border-radius:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto}.cart-item{display:flex;justify-content:space-between;align-items:center;background:#2a4d3f;padding:6px 10px;border-radius:8px;margin-top:6px;font-size:14px}.cart-item button{background:#fff;color:#1E3A2F;border:0;border-radius:6px;padding:2px 8px;font-weight:900;margin-left:4px}.cart-actions{display:flex;gap:8px;margin-top:8px}.btn-mp{flex:1;background:#009ee3;color:#fff;border:0;padding:14px;border-radius:10px;font-weight:900}.btn-wa{flex:1;background:#fff;color:#1E3A2F;border:0;padding:14px;border-radius:10px;font-weight:900}</style></head><body>
<header><img src="img/logo.png"><h2>meat & love ♡</h2></header>
<div class="grid" id="grid"></div>
<div class="cart"><b id="total">Carrito vacío</b><small id="det">Envío CDMX $99 - Ya puedes quitar productos</small><div id="lista"></div><div class="cart-actions"><button class="btn-mp" onclick="pagar()">Pagar con Mercado Pago</button><button class="btn-wa" onclick="wa()">WhatsApp</button></div></div>
<script>
const ENVIO=99;
const MP_LINK = "https://mpago.la/TU_LINK_AQUI";
const prods=[["SIRLOIN 500g",333,"sirloin.jpg"],["TOCINO 500g",285,"tocino.jpg"],["ARRACHERA 500g",320,"arrachera.jpg"],["BISTEC 500g",320,"bistec.jpg"],["CECINA 500g",333,"cecina.jpg"],["CHORIZO 500g",229,"chorizo.jpg"],["COSTILLAS 500g",438,"costillas.jpg"],["FILETE 500g",385,"filete.jpg"],["HUEVO 30pzas",156,"huevo.jpg"],["LOMO 500g",250,"lomo.jpg"],["MILANESA 500g",325,"milanesa.jpg"],["MOLIDA 500g",240,"molida.jpg"],["MOLIDA DIEZMILLO 500g",320,"molidadiezmillo.jpg"],["PAVO TG 1kg",320,"pavoTG.jpg"],["PICAÑA 500g",307,"picana.jpg"],["RETAZO 500g",206,"retazo.jpg"]];
let cart=[]; const grid=document.getElementById('grid');
prods.forEach((p,i)=>{let img=p[2]==='pavoTG.jpg'?`<img src="img/${p[2]}" onerror="this.src='img/pavotg.jpg'">`:p[2]==='costillas.jpg'?`<img src="img/${p[2]}" onerror="this.src='img/costilla.jpg'">`:`<img src="img/${p[2]}">`;grid.innerHTML+=`<div class="card">${img}<h3>${p[0]}</h3><b>$${p[1]}</b><br><button class="btn" onclick="add(${i})">Agregar</button></div>`;});
function add(i){let f=cart.find(c=>c.name===prods[i][0]);if(f)f.qty++;else cart.push({name:prods[i][0],price:prods[i][1],qty:1});render();}
function render(){let lista=document.getElementById('lista');lista.innerHTML='';if(!cart.length){document.getElementById('total').innerText='Carrito vacío';document.getElementById('det').innerText='Envío CDMX $99';return;}let s=cart.reduce((a,b)=>a+b.price*b.qty,0);let c=cart.reduce((a,b)=>a+b.qty,0);document.getElementById('total').innerText=`Total: $${s+ENVIO} (${c} productos)`;document.getElementById('det').innerText=`Subtotal $${s} + Envío $${ENVIO}`;cart.forEach((it,idx)=>{lista.innerHTML+=`<div class="cart-item"><span>${it.name} x${it.qty}</span><span><button onclick="cambia(${idx},-1)">-</button><button onclick="cambia(${idx},1)">+</button><button onclick="quita(${idx})"> X </button></span></div>`});}
function cambia(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);render();}
function quita(i){cart.splice(i,1);render();}
function wa(){if(!cart.length)return alert('Agrega algo');let s=cart.reduce((a,b)=>a+b.price*b.qty,0);let l=cart.map(p=>`- ${p.name} x${p.qty}`).join('%0A');window.open(`https://wa.me/525611281892?text=Hola quiero:%0A${l}%0ATOTAL $${s+ENVIO}`,'_blank')}
function pagar(){if(!cart.length)return alert('Agrega algo'); window.open(MP_LINK,'_blank');}
</script></body></html>
