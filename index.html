<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meat N Love - Carnes Premium CDMX</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 font-sans">
<!-- BANNER VIRREYES -->
<div class="bg-black text-white text-center py-2.5 px-4 text-[13px] font-bold tracking-wide">
🥩 NUEVO: Recoge GRATIS en Virreyes - Morvan 196 B - Lunes 2pm a 8pm
</div>

<header class="bg-white border-b sticky top-0 z-10">
<div class="max-w-4xl mx-auto p-4 flex justify-between items-center">
<h1 class="text-2xl font-black">MEAT N LOVE</h1>
<button id="cartBtn" class="bg-black text-white px-4 py-2 rounded-full text-sm">Carrito (<span id="cartCount">0</span>)</button>
</div>
</header>

<main class="max-w-4xl mx-auto p-4 grid md:grid-cols-2 gap-6 mt-6">
<div>
<h2 class="text-xl font-bold mb-4">Cortes Premium</h2>
<div id="products" class="grid gap-3"></div>
</div>

<div class="bg-white rounded-2xl border p-5 h-fit">
<h3 class="font-bold text-lg">Tu Pedido</h3>
<div id="cartItems" class="mt-4 text-sm text-gray-500">Carrito vacío</div>

<div class="mt-6 border-t pt-4">
<p class="font-bold text-sm mb-3">Tipo de Entrega</p>
<label class="flex gap-3 p-3 border rounded-xl cursor-pointer mb-2 hover:bg-gray-50">
<input type="radio" name="ship" value="180" checked onchange="calc()">
<div class="text-sm"><b>Envío a domicilio CDMX - $180</b><br><span class="text-xs text-gray-600">Entrega en 24hrs</span></div>
</label>
<label class="flex gap-3 p-3 border-2 border-black bg-yellow-50 rounded-xl cursor-pointer">
<input type="radio" name="ship" value="0" id="pickup" onchange="calc()">
<div class="text-sm"><b>📍 Recoger en Morvan 196 B - GRATIS</b><br>
<span class="text-xs">Lomas de Virreyes - Lunes 2pm a 8pm<br><b style="color:green">Te ahorras $180</b> - Te aviso por WA</span></div>
</label>
</div>

<div class="mt-4 space-y-1 text-sm">
<div class="flex justify-between"><span>Subtotal</span><span id="sub">$0</span></div>
<div class="flex justify-between"><span>Envío</span><span id="shipCost">$180</span></div>
<div class="flex justify-between font-black text-lg border-t pt-2"><span>Total</span><span id="total">$0</span></div>
</div>

<input id="custName" placeholder="Tu nombre" class="w-full mt-4 p-3 border rounded-xl text-sm">
<input id="custPhone" placeholder="WhatsApp" class="w-full mt-2 p-3 border rounded-xl text-sm">

<button onclick="orderWA()" class="w-full bg-black text-white py-4 rounded-xl font-bold mt-4">PEDIR POR WHATSAPP</button>
<p id="pickupNote" class="hidden mt-3 text-xs bg-yellow-100 p-2 rounded-lg text-center">📍 Recogerás en: <b>Morvan 196 B, Lomas de Virreyes</b> el Lunes 2pm-8pm</p>
</div>
</main>

<script>
const prods=[
{name:"Ribeye USDA Prime 500g",price:450},
{name:"Arrachera Marinada 1kg",price:380},
{name:"Picaña Angus 1kg",price:520},
{name:"Hamburguesas Wagyu x4",price:320},
];
let cart=[];
const prodDiv=document.getElementById('products');
prods.forEach((p,i)=>{
prodDiv.innerHTML+=`<div class="bg-white border rounded-xl p-4 flex justify-between items-center"><div><b class="text-sm">${p.name}</b><br><span class="text-sm">$${p.price}</span></div><button onclick="add(${i})" class="bg-black text-white px-3 py-1.5 rounded-full text-xs">Agregar</button></div>`
});
function add(i){
let f=cart.find(c=>c.i==i);
if(f)f.q++; else cart.push({i,q:1});
render();
}
function render(){
let cDiv=document.getElementById('cartItems');
if(cart.length==0){cDiv.innerHTML='Carrito vacío';}
else{
cDiv.innerHTML=cart.map(c=>`${prods[c.i].name} x${c.q} - $${prods[c.i].price*c.q} <button onclick="cart=cart.filter(x=>x.i!=${c.i});render()" class="text-red-500 ml-2">x</button>`).join('<br>');
}
document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.q,0);
calc();
}
function calc(){
let sub=cart.reduce((a,b)=>a+b.q*prods[b.i].price,0);
let ship=parseInt(document.querySelector('input[name="ship"]:checked').value);
document.getElementById('sub').innerText='$'+sub;
document.getElementById('shipCost').innerText=ship==0?'GRATIS':'$'+ship;
document.getElementById('total').innerText='$'+(sub+ship);
document.getElementById('pickupNote').classList.toggle('hidden',ship!=0);
}
function orderWA(){
let sub=cart.reduce((a,b)=>a+b.q*prods[b.i].price,0);
let ship=parseInt(document.querySelector('input[name="ship"]:checked').value);
let total=sub+ship;
let name=document.getElementById('custName').value;
let isPickup=ship==0;
let msg=`Hola Meat N Love! Quiero pedir:%0A${cart.map(c=>`- ${prods[c.i].name} x${c.q}`).join('%0A')}%0A%0ASubtotal: $${sub}%0AEnvio: ${isPickup?'GRATIS (Recojo en Morvan 196 B)':'$'+ship}%0ATotal: $${total}%0A%0ANombre: ${name}%0A${isPickup?'📍 RECOGER EN: Morvan 196 B, Lomas Virreyes - Lunes 2pm-8pm':''}`;
window.open('https://wa.me/52555611281892?text='+msg,'_blank');
}
render();
</script>
</body>
</html>
